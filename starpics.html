<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarPics</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:#0a0e1a;color:#e8ecf7}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
  #gate .card{background:#131a2e;border:1px solid #232c47;border-radius:14px;padding:36px 32px;max-width:360px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.4);text-align:center}
  #gate .eye{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7ea8ff;margin-bottom:8px}

  #gate .sub{font-size:13px;color:#8b93ac;margin-bottom:20px}
  #gate input{width:100%;padding:11px 14px;font-size:15px;border:1px solid #232c47;border-radius:8px;margin-bottom:12px;background:#0f1424;color:#e8ecf7}
  #gate input:focus{outline:2px solid #7ea8ff;border-color:#7ea8ff}
  #gate button{width:100%;padding:11px;font-size:15px;font-weight:600;background:#7ea8ff;color:#0a0e1a;border:none;border-radius:8px;cursor:pointer}
  #gate button:hover{background:#5c8ce6}
  #gate button:disabled{opacity:.6;cursor:wait}
  #gate .err{color:#f87171;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>

    <div class="err" id="e"></div>
  </form>
</div>

<script>
(function(){
  var D=JSON.parse(document.getElementById("data").textContent);
  var KEY="starpics_key";
  var MAX_AGE=90*24*60*60*1000;
  var f=document.getElementById("f"),p=document.getElementById("p"),
      e=document.getElementById("e"),b=document.getElementById("b");

  function b64ToBytes(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
  function bytesToHex(a){return Array.from(a).map(function(x){return x.toString(16).padStart(2,"0")}).join("");}
  function hexToBytes(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}

  async function deriveKey(pw){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:b64ToBytes(D.salt),iterations:D.iter,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},true,["decrypt"]);
  }
  async function decryptWith(key){
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(D.iv)},key,b64ToBytes(D.ct));
    return new TextDecoder().decode(pt);
  }
  function render(htmlStr){
    var g=document.getElementById("gate"); if(g) g.remove();
    document.body.innerHTML=htmlStr;
  }
  async function tryStored(){
    try{
      var raw=localStorage.getItem(KEY);if(!raw)return false;
      var o=JSON.parse(raw);if(Date.now()-o.t>MAX_AGE){localStorage.removeItem(KEY);return false;}
      var key=await crypto.subtle.importKey("raw",hexToBytes(o.k),{name:"AES-GCM"},true,["decrypt"]);
      var html=await decryptWith(key);render(html);return true;
    }catch(_){return false;}
  }

  tryStored().then(function(ok){ if(!ok) p.focus(); });

  f.addEventListener("submit",async function(ev){
    ev.preventDefault();b.disabled=true;e.textContent="Розшифрування…";
    try{
      var key=await deriveKey(p.value);
      var html=await decryptWith(key);
      var raw=await crypto.subtle.exportKey("raw",key);
      try{localStorage.setItem(KEY,JSON.stringify({k:bytesToHex(new Uint8Array(raw)),t:Date.now()}));}catch(_){}
      render(html);
    }catch(_){
      e.textContent="Невірний пароль";p.value="";b.disabled=false;p.focus();
    }
  });
})();
</script>
